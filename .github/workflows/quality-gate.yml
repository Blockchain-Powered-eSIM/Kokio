name: PR Quality Gate

# Add named branches once branching startegy is concerete
on:
  pull_request:
  push:

jobs:
  quality-gate:
    name: Sanity Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      # expo-doctor runs the full SDK/config/dependency check set as a blocking
      # gate. Two checks are intentionally scoped out via the expo.doctor block
      # in package.json, each justified there:
      #   - appConfigFieldsNotSyncedCheck disabled: committed native android/
      #     and ios/ (non-CNG) is a deliberate posture, not a config-sync gap.     

      - name: Expo doctor
        run: npx expo-doctor

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Stray Logs
        run: npm run lint:console

      # Deferred
      # The suite is not actively maintained against this PR gate yet. 
      # Re-enable this step once test suite is up-to-date w.r.t. tooling and functionality.
      #   - react-test-renderer (19.0.0) aligned with react (19.2.0)
      #   - @types/node added + "node" added to tsconfig.test.json `types`
      #   - utils/auth/__tests__/refresh.test.ts tuple-indexing bug fixed
      #
      # - name: Test
      #   run: npx jest -c jest.config.js && npx tsc -p tsconfig.test.json

      - name: Audit
        run: npm run audit
