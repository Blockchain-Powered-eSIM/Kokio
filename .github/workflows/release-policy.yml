name: Release Policy

on:
  pull_request:
    branches:
      - dev
      - staging
      - production
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited
      - ready_for_review

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata and versions
        run: node scripts/validate-release-pr.mjs
