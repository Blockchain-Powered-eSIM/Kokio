name: Deploy staging (iOS)

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: staging

  submit_ios:
    name: Submit iOS to App Store Connect (TestFlight Internal)
    needs: [build_ios]
    type: submit
    environment: preview
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: staging
