name: Deploy staging (Android)

defaults:
  tools:
    node: "24.18.0"
    corepack: true

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: staging

  submit_android:
    name: Submit Android to Internal Testing
    needs: [build_android]
    type: submit
    environment: preview
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: staging
