name: Deploy staging

on:
  push:
    branches: ['staging']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview

  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: staging
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: staging
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: staging

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: staging

  submit_android:
    name: Submit Android to open testing
    needs: [build_android]
    type: submit
    environment: preview
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: staging

  distribute_ios_testflight:
    name: Distribute iOS to TestFlight
    needs: [build_ios]
    type: testflight
    environment: preview
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: staging
      external_groups: ["Public"]
      submit_beta_review: true

  publish_android_update:
    name: Publish Android staging OTA update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      branch: staging
      platform: android

  publish_ios_update:
    name: Publish iOS staging OTA update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      branch: staging
      platform: ios
