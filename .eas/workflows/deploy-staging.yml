name: Deploy staging

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: staging

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: staging

  submit_android:
    name: Submit Android to open testing
    needs: [build_android]
    type: submit
    environment: preview
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: staging

  distribute_ios_testflight:
    name: Distribute iOS to TestFlight
    needs: [build_ios]
    type: testflight
    environment: preview
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: staging
      external_groups: ["Public"]
      submit_beta_review: true
