// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  // @stripe/stripe-react-native pulls in stripe-android-issuing-push-provisioning (compileOnly),
  // which depends at runtime on play-services-tapandpay. That artifact is a private Google SDK
  // that is not on any public repository, and the release lint check (AGP 9) tries to resolve it.
  // Kokio does not use Issuing push provisioning.
  configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-tapandpay'
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
